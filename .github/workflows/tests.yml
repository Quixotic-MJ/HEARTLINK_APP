# Runs every test on GitHub whenever code is pushed to staging or main, or a pull request is opened,
# so a broken change shows a red cross on GitHub before it reaches the live app.
# The tests never touch the real database: no Supabase keys are given here, and tests that need data use stand-ins.
name: Tests

on:
  push:
    branches: [staging, main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  mobile:
    name: Phone app tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: HeartLink-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: HeartLink-mobile/package-lock.json
      - run: npm ci
      - run: npx jest --ci

  web:
    name: Web portal build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: HeartLink-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: HeartLink-web/package-lock.json
      - run: npm ci
      - run: npm run build
